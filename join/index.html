<!doctype html>
<!--
  招待リンクの案内ページ。URLの # の後ろ（サーバーへ送られない部分）にある招待を、アプリへ渡すだけ。
  どこにもデータを送らず、何も保存しない。
  アプリ用のリンクの名前（下の SCHEME）は、アプリの設定と同じにする（変える時は README を見る）。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>テーブルスタジオに参加</title>
<style>
  :root {
    --app: #f6f5f2; --surface: #ffffff; --surface2: #efede8; --line: #dad6ce;
    --ink: #1c1b19; --ink2: #5b5750; --ink3: #6f6a62; --accent: #9c5f17; --accent-ink: #ffffff; --danger: #c23f36;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --app: #131417; --surface: #1a1b1f; --surface2: #212328; --line: #2a2c31;
      --ink: #eceae5; --ink2: #a7a39b; --ink3: #928e86; --accent: #d99a4e; --accent-ink: #1a1107; --danger: #ec6a5f;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"] {
    --app: #131417; --surface: #1a1b1f; --surface2: #212328; --line: #2a2c31;
    --ink: #eceae5; --ink2: #a7a39b; --ink3: #928e86; --accent: #d99a4e; --accent-ink: #1a1107; --danger: #ec6a5f;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--app); color: var(--ink);
    font: 15px/1.7 "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif; }
  main { width: min(480px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; color: var(--ink2); }
  .logo span { width: 28px; height: 28px; border-radius: 7px; background: var(--ink); color: var(--app); display: grid; place-items: center; font-family: "Shippori Mincho", "Yu Mincho", serif; font-weight: 700; }
  h1 { margin: 0; font-size: 21px; font-weight: 600; line-height: 1.4; }
  p { margin: 0; color: var(--ink2); }
  .open { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 16px; text-decoration: none; }
  .open:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .help { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 12px; }
  .help[hidden], .open[hidden] { display: none; }
  h2 { margin: 0; font-size: 15px; font-weight: 600; }
  ol { margin: 0; padding-left: 1.4em; color: var(--ink2); display: flex; flex-direction: column; gap: 6px; }
  ol a { color: var(--accent); }
  .code { display: flex; gap: 8px; align-items: stretch; }
  .code code { flex: 1; min-width: 0; padding: 8px 10px; border-radius: 6px; background: var(--surface2); font: 600 14px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace; overflow-wrap: anywhere; user-select: all; }
  .code button { flex: none; min-width: 72px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; cursor: pointer; }
  .code button:hover { background: var(--surface2); }
  .note { font-size: 13px; color: var(--ink3); }
  .err { color: var(--danger); }
</style>
</head>
<body>
<main>
  <div class="logo"><span>T</span>テーブルスタジオ</div>
  <div id="ok">
    <h1>部屋に招待されています</h1>
    <p>アプリが開いて、ホームの「参加」に招待が入ります。表示名を確かめて「参加」を押してください。</p>
  </div>
  <a class="open" id="open" href="#">アプリで開く</a>
  <section class="help" id="help" hidden>
    <h2>アプリが開かない時</h2>
    <ol>
      <li><a id="download" href="https://github.com/reverinudog/table-studio/releases" rel="noopener">アプリ（無料）</a>を入れて、もう一度このページの「アプリで開く」を押してください。</li>
      <li>または、下の招待をコピーして、アプリのホームの「参加」に貼ってください。</li>
    </ol>
    <div class="code"><code id="code"></code><button type="button" id="copy">コピー</button></div>
  </section>
  <p class="note">このページは招待をアプリへ渡すだけで、どこにも送らず、何も保存しません。</p>
</main>
<script>
  // アプリ用のリンクの名前（仮）。app/src/lib/net/code.ts の LINK_SCHEME と同じにする
  var SCHEME = 'tablestudio';
  var invite = '';
  try { invite = decodeURIComponent(location.hash.slice(1)); } catch (e) { invite = ''; }
  var open = document.getElementById('open');
  var help = document.getElementById('help');
  if (!invite) {
    document.getElementById('ok').innerHTML = '<h1>招待リンクが正しくありません</h1><p class="err">GMから届いたリンクを、もう一度そのまま開いてください。</p>';
    open.hidden = true;
  } else {
    var appLink = SCHEME + '://join/?i=' + encodeURIComponent(invite);
    open.href = appLink;
    document.getElementById('code').textContent = invite;
    // アプリが開けば、このページは裏へ回る。しばらくしても前にあれば案内を出す
    var shown = false;
    var showHelp = function () { if (!shown && !document.hidden) { shown = true; help.hidden = false; } };
    open.addEventListener('click', function () { setTimeout(showHelp, 1500); });
    location.href = appLink;
    setTimeout(showHelp, 1500);
    document.getElementById('copy').addEventListener('click', function (e) {
      var b = e.currentTarget;
      navigator.clipboard.writeText(invite).then(function () { b.textContent = 'コピー済み'; }, function () { b.textContent = '選んでコピー'; });
    });
  }
</script>
</body>
</html>
